## The number of worker processes, should be the same as your number
## of cores.
nworkers: 4
logfile: tlsproxy.log
## Log levels are: FATAL ERROR WARN INFO DEBUG
loglevel: DEBUG

listeners:
  - name: https
    ## Connection details of the backend server
    target-ip: 127.0.0.1
    target-port: 8080

    ## If we can't connect to the server by this time, drop the connection.
    ## Optional, in seconds, and a 0 is read as absent; leaving it out takes
    ## 60 seconds, which is what nginx's proxy_connect_timeout does.
    connect-timeout: 5

    ## TCP keepalive configuration, set on both the client and the backend
    ## leg. There's no idle timeout yet, so this is what bounds a peer that
    ## dies without sending a FIN. All three are optional and the values below
    ## are the defaults. A 0 is read as absent and takes the default too, since
    ## setsockopt() rejects 0 for all three of these.
    ## The kernel caps these well below what the field can hold: keepidle and
    ## keepintvl at 32767 seconds and keepcnt at 127 probes. Anything above
    ## that is refused at startup, since setsockopt() would return EINVAL for
    ## it in the worker, where there is nobody left to tell.
    ## keepidle: the seconds before we need to send a keepalive
    tcp-keepidle: 60
    ## keepintvl: the interval between keepalives sent
    tcp-keepintvl: 10
    ## keepcnt: the number of keepalives that need to be dropped before we close
    tcp-keepcnt: 3

    ## Once we're finished with a connection we keep reading from the client
    ## and throwing it away, so that close() sends a FIN rather than a RST.
    ## These two bound how long we're willing to do that for. Both are
    ## optional and the values below are the defaults.
    ## shutdown-timeout: the longest the whole teardown may take, in seconds
    shutdown-timeout: 30
    ## shutdown-interval: if the client sends us nothing for this many seconds,
    ## send our FIN and leave
    shutdown-interval: 5

    ## The proxy will accept connections on <listen-ip>:<listen-port>
    ## 0.0.0.0 means listen on every interface
    listen-ip: 0.0.0.0
    listen-port: 8443

    ## The certificate chain offered to clients. Nothing here is verified:
    ## we don't build a path against a trust store, check a signature or look
    ## at an expiry date, so a chain with a gap in it starts and fails at the
    ## client instead. The one check is OpenSSL's, that servkey belongs to
    ## the certificate we're serving, and that one refuses to start.
    ##
    ## servcert is the server's own certificate and cacerts holds the
    ## intermediates above it. We work upwards from servcert, taking the
    ## listed certificate whose subject matches the issuer we're looking for,
    ## so the order of the list doesn't matter, and anything left over is
    ## named in a warning and not sent.
    ##
    ## Two things to know before writing the list. One file, one certificate:
    ## we read the first certificate in each of these files and stop there, so
    ## a bundle holding several has to be split up first, and since the ones
    ## after the first are never read, nothing warns that they were skipped.
    ## And leave the root out, since a client that doesn't already trust it
    ## has no use for a copy and one that does has it already, so sending it
    ## costs a certificate's worth of handshake and buys nothing. The root is
    ## on the path upwards, so if you do list it, it goes out.
    ##
    ## If all you have is a self-signed server certificate, put it in
    ## cert-chain instead of servcert, and leave servcert and cacerts empty.
    ## That is a supported way to run: the certificate goes out on its own
    ## and the client decides what to make of it, which for openssl s_client
    ## is "18 (self-signed certificate)" unless it has been given the same
    ## file. Listing that certificate in cacerts as well sends it twice,
    ## since it is its own issuer.
    cacerts:
      - intcert.pem
    servcert: servcert.pem
    ## Anything group or other can read, write or execute here draws a warning
    ## at startup and on every reload, on stderr as well as in the log. It is
    ## only a warning, so 0600 is a recommendation rather than a requirement.
    servkey: servkey.pem
    ## If the servkey is encrypted:
    #servkeypass: test

  ## Basic load balancing
  # - name: https2
  #   target-ip: 127.0.0.1
  #   target-port: 8081

  #   connect-timeout: 6

  #   ## Note we're using the same IP/port combo for the listen socket
  #   ## That's right, we get basic load balancing too!
  #   listen-ip: 0.0.0.0
  #   listen-port: 8443

  #   ## The certificate chain offered to clients, as one file holding the
  #   ## server certificate first, then its issuer, then that certificate's
  #   ## issuer, and so on, stopping one short of the root. We send the file
  #   ## as written rather than sorting it, so a file out of order reaches
  #   ## the client out of order, a root left in is sent for no benefit, and
  #   ## an unrelated certificate in there is sent too. A file whose first
  #   ## certificate isn't the server's own is caught only when servkey then
  #   ## doesn't match it, which is a refusal to start.
  #   cert-chain: chain.pem
  #   servkey: servkey.pem

  ## Pointing to another service
  # - name: telnets
  #   target-ip: 127.0.0.1
  #   target-port: 23

  #   connect-timeout: 2

  #   listen-ip: 0.0.0.0
  #   listen-port: 42023

  #   ## Leaf first, then each issuer in turn, stopping before the root
  #   cert-chain: chain.pem
  #   servkey: servkey.pem
