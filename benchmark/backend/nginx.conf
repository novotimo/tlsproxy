worker_processes  2;
error_log  stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  32768;
    multi_accept        on;
}

http {
    access_log  off;
    sendfile    on;
    tcp_nodelay on;
    default_type application/octet-stream;

    ## A handshake test opens backend connections that never send a request.
    ## At nginx's 60s default the backend holds every one of them, filling to
    ## its worker_connections ceiling, and what gets measured is the backend's
    ## reaping rather than the proxy under test.
    client_header_timeout 2s;

    ## High enough that the backend never closes a pooled connection during a
    ## run, since Test B is measuring what upstream reuse is worth.
    keepalive_timeout  300;
    keepalive_requests 10000000;

    server {
        listen      80 backlog=65535 reuseport;
        server_name _;
        root        /payload;

        location / {
            try_files $uri =404;
        }
    }
}
