## One worker per logical CPU in the cpuset, matching the other subjects.
## Each worker calls frontend_listen() for itself after the fork
## (src/hitch.c:start_workers()), so the listening sockets are SO_REUSEPORT
## siblings, the same arrangement tlsproxy's child_loop() arrives at.
##
## Groups, ciphersuites and the version range are left at hitch's defaults and
## pinned at the client instead, as they are for every other subject. An
## unset ecdh-curve means "auto", so OpenSSL picks whatever the client offers.
workers = 8
backlog = 65535

frontend = "[0.0.0.0]:8443"
backend  = "[backend]:80"

## pem-file wants the chain and the key in one file, which is what
## certs/mkcerts.sh already writes for haproxy.
pem-file = "/etc/certs/leaf.pem"

## Off for the headline, as on the other three.
daemon = off
syslog = off
quiet = on
log-level = 0

## The backend is a plain TCP endpoint here, so nothing is prepended to the
## stream; write-proxy-v2 and friends default to off and stay off.
user  = "hitch"
group = "hitch"
