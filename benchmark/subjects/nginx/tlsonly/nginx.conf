## Diagnostic only, not a benchmark subject: nginx terminating TLS with no
## upstream and no proxying, to separate TLS/connection handling from the
## stream proxy path. Everything else matches subjects/nginx/stream.
worker_processes     8;
worker_rlimit_nofile 1048576;
error_log            stderr warn;
pid                  /tmp/nginx.pid;

events {
    worker_connections 65536;
    multi_accept       on;
}

http {
    access_log off;

    server {
        listen 8443 ssl backlog=65535 reuseport;

        ssl_certificate     /etc/certs/chain.crt;
        ssl_certificate_key /etc/certs/leaf.key;
        ssl_session_cache   off;
        ssl_session_tickets off;

        location / { return 200 "x"; }
    }
}
