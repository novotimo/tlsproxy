worker_processes     4;
worker_rlimit_nofile 1048576;
error_log            stderr warn;
pid                  /tmp/nginx.pid;

events {
    worker_connections 65536;
    multi_accept       on;
}

stream {
    ## No access_log directive, so stream logging is off.
    server {
        listen     8443 ssl backlog=65535 reuseport;
        proxy_pass backend:80;

        ## One upstream connection per client connection, which is what stream
        ## does anyway; there is no pooling here to turn off.
        proxy_connect_timeout 5s;

        ssl_certificate     /etc/certs/chain.crt;
        ssl_certificate_key /etc/certs/leaf.key;
        ssl_session_cache   off;
        ssl_session_tickets off;
    }
}
