global
    nbthread 4
    ## haproxy needs about 2 fds per connection and raises RLIMIT_NOFILE to
    ## suit, so this has to stay well under the container's 1048576 or it
    ## refuses to start. Still an order of magnitude above the 20k sweep.
    maxconn  200000
    ## Off, matching nginx's ssl_session_cache off and tlsproxy having none.
    tune.ssl.cachesize 0
    ssl-default-bind-options no-tls-tickets
    ## No log directive, so logging is off.

defaults
    mode    tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend bench
    bind :8443 ssl crt /etc/certs/leaf.pem
    default_backend origin

backend origin
    ## One backend connection per client connection. mode tcp does not pool.
    server s backend:80
