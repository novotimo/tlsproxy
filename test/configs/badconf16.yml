# One above the largest port. The field is a uint, so the schema takes it and
# the truncation to uint16_t in the sockaddr would silently proxy to port 0.

nworkers: 1
listeners:
  - name: https
    target-ip: 127.0.0.1
    target-port: 65536

    listen-ip: 0.0.0.0
    listen-port: 8443

    cert-chain: chain.pem
    servkey: servkey.pem
