services:
  web:
    image: nginx:stable-alpine
    hostname: nginx-web
    networks:
      proxy-demo:
        aliases:
          - nginx-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 64
    mem_limit: 128m

  prox:
    image: novotimo/tlsproxy:latest
    depends_on:
      - web
    networks:
      - proxy-demo
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: bind
        source: ./config
        target: /etc/tlsproxy
        read_only: true
      - type: volume
        source: tlsproxy-logs
        target: /var/log/tlsproxy
    ports:
      - "443:8443"

networks:
  proxy-demo:

volumes:
  tlsproxy-logs:
