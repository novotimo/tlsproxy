name: CMake Build and Test

# Runs on every branch, not just main: the test suites are the thing being
# developed here, and a suite that only runs after merge is not a gate.
#
# push only, no pull_request: with both, every push to a branch with an open PR
# ran the whole matrix twice. push fires once per commit and covers a branch
# before any PR exists, which pull_request cannot. The cost is that this tests
# the branch tip rather than the tip merged into main -- rebase before merging.
# A PR from a fork would get no CI here; origin has no forks today.
on:
  push:
    branches: [ "**" ]

env:
  BUILD_TYPE: Debug

# EXPECTED STATE OF THIS WORKFLOW
#
# All four jobs are expected GREEN. Measured on main at f5f6be5 (2026-08-05):
# 153 tests across six binaries, 6/6 passing, and Release builds clean at -O2
# under -Werror.
#
# This job was deliberately RED for a while: each failing test pinned an
# unfixed finding in src/, named after the claim it made, so ctest output was
# the bug list. Those findings are fixed and the tests went green on their own,
# which was the signal to expect. The pattern is worth reusing -- write the
# failing test first, let the fix turn it green -- but the counts are only ever
# true for a moment, so keep this note in step with reality. A stale number
# here reads as a regression that never happened.
#
# Do not add continue-on-error to the unit-tests job.

jobs:
  unit-tests:
    name: Unit tests (Debug)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        libssl-dev libcyaml-dev libcmocka-dev pkg-config

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DUNIT_TESTING=y

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      run: ctest --test-dir build --output-on-failure

  # The single highest value addition here. Every build in this workflow before
  # it was -O0, and GCC does not run its may-be-uninitialised analysis at -O0 --
  # so a whole class of defect was invisible to CI while being present in the
  # image the Dockerfile ships, which builds Release.
  #
  # It paid for itself on the first run. With GCC 15.3 it failed on
  # src/logging.c with two -Werror errors; both also reproduced on main, so
  # neither came from the write_logs rework:
  #
  #   unused parameter 'worker_pid'   log_worker filled its output buffer from
  #                                   inside assert(snprintf(...)). NDEBUG
  #                                   deleted the snprintf along with the
  #                                   assert, so the shipped Release image
  #                                   logged worker_pid="" and code="" -- the
  #                                   parameter genuinely was unused there.
  #                                   The asserts are gone now; intstr is sized
  #                                   so truncation cannot happen anyway.
  #   'transform' may be used         _linebuf_append left its function pointer
  #   uninitialized                   indeterminate for any mode outside the
  #                                   three TPX_MODE_* constants. Latent: no
  #                                   caller passes one. It is initialised to
  #                                   NULL and the call is guarded now.
  #
  # Note what that first one means for the job's scope: it is not only a
  # warnings gate, it is the only build here compiled with NDEBUG. Anything the
  # project does inside an assert() gets exercised, or rather not exercised,
  # exclusively by this job.
  #
  # Older toolchains are less aggressive about the uninitialised analysis,
  # which is presumably how the published image was ever built; that makes
  # keeping this job more useful, not less. Expected GREEN from here on.
  release-build:
    name: Release build (-Werror at -O2)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libcyaml-dev pkg-config

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build

  # ASAN and UBSAN together. Measured before writing this: -fsanitize=address
  # coexists with the linker's --wrap machinery the mocks are built on, so the
  # suites do not have to be rebuilt differently to run here.
  #
  # This job keys on sanitizer diagnostics rather than on the exit code. That
  # started as a workaround for the suites exiting nonzero on pinned findings,
  # but it is worth keeping on its own merits: UBSAN with halt_on_error=0
  # reports and continues, so a runtime error does not move the exit code at
  # all. The grep is the only thing that sees those.
  sanitizers:
    name: ASAN + UBSAN
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        libssl-dev libcyaml-dev libcmocka-dev pkg-config

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=Debug -DUNIT_TESTING=y \
          -DSANITIZE=address,undefined

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    # Leak detection used to be off for test_proxy, test_listen and
    # test_logging: a test that failed by design did so through cmocka's
    # longjmp, which skips the cleanup at the end of the test function, so those
    # leaks were an artifact of the pinned finding rather than a defect. Nothing
    # fails by design any more, so the carve-out is gone. Measured 2026-08-05 on
    # main at f5f6be5, GCC 15.3: all six suites exit 0 with detect_leaks=1 and
    # emit no ASAN, LSAN or UBSAN diagnostics at all. If a leak turns up here on
    # a different toolchain, that is a finding, not a reason to switch it back
    # off.
    - name: Run under sanitizers
      run: |
        set +e
        mkdir -p san
        export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:suppressions=$PWD/test/ubsan.supp"
        export ASAN_OPTIONS=detect_leaks=1
        for t in test_queue test_config test_event test_proxy test_listen test_logging; do
          ./build/test/$t > san/$t.log 2>&1
        done
        echo "=== sanitizer diagnostics ==="
        grep -hE 'runtime error|ERROR: AddressSanitizer|ERROR: LeakSanitizer' \
             san/*.log | sort | uniq -c | tee san/findings.txt
        if [ -s san/findings.txt ]; then
          echo "::error::sanitizers reported the diagnostics above"
          exit 1
        fi
        echo "no sanitizer diagnostics"

    - name: Upload sanitizer logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-logs
        path: san/

  # Kept as its own job rather than folded into the sanitizer one: valgrind and
  # ASAN cannot run against the same binary, and valgrind sees things ASAN does
  # not -- uninitialised reads in particular. That is the same class the
  # release-build job gates, but the two are complementary rather than
  # redundant: GCC only reports what it can prove statically, and memcheck only
  # reports what the suites actually execute.
  #
  # NOT VERIFIED LOCALLY. valgrind is not installed on the machine this was
  # written on, so unlike every other job here the invocation has not been run
  # end to end -- only the build it depends on has. Treat the first CI run as
  # the test of this job.
  valgrind:
    name: Valgrind (memcheck)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        libssl-dev libcyaml-dev libcmocka-dev pkg-config valgrind

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DUNIT_TESTING=y

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    # --error-exitcode is deliberately NOT set: memcheck findings should be read
    # in context rather than collapsed into a pass/fail, and the suites' own
    # exit codes are already gated by the unit-tests job. The ERROR SUMMARY grep
    # below is what surfaces them here.
    - name: Run under memcheck
      run: |
        set +e
        mkdir -p vg
        for t in test_queue test_config test_event test_proxy test_listen test_logging; do
          valgrind --tool=memcheck --leak-check=full --track-origins=yes \
                   --errors-for-leak-kinds=definite \
                   --log-file=vg/$t.vg ./build/test/$t > vg/$t.out 2>&1
        done
        echo "=== memcheck error summaries ==="
        grep -h 'ERROR SUMMARY' vg/*.vg

    - name: Upload valgrind logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: valgrind-logs
        path: vg/
